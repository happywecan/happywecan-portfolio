spring.application.name=portfolio-api
server.port=${PORT:8080}

# Keep the database configurable so local development, Docker, and production
# can use different MongoDB instances without changing Java source code.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/portfolio}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,mongo
management.endpoint.health.group.liveness.include=livenessState

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

app.security.jwt-secret=${SECRET_KEY:change-this-development-secret-before-production-1234567890}
app.security.jwt-expiration-minutes=${ACCESS_TOKEN_EXPIRE_MINUTES:60}
app.security.public-rate-limit-per-minute=${PUBLIC_RATE_LIMIT_PER_MINUTE:20}
app.upload.directory=${UPLOAD_DIR:../static/uploads}
app.upload.max-bytes=${MAX_UPLOAD_BYTES:5242880}
app.mongodb.server-selection-timeout=${MONGODB_SERVER_SELECTION_TIMEOUT:5s}
app.mongodb.connect-timeout=${MONGODB_CONNECT_TIMEOUT:3s}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.mail.host=${MAIL_SERVER:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_USE_TLS:true}

server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
logging.pattern.level=%5p [requestId:%X{requestId:-}]
