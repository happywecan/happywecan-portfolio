services:
  backend:
    image: asia-east1-docker.pkg.dev/focal-freedom-473403-f8/happywecan/happywecan-api:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: https://angelo.happywecan.com
      MAIL_SERVER: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_USE_TLS: "True"
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./static/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 25s

  frontend:
    image: asia-east1-docker.pkg.dev/focal-freedom-473403-f8/happywecan/happywecan-frontend:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.happywecan.com
      INTERNAL_API_URL: http://backend:8080
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docs/nginx-vm.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
